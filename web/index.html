<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>玩具兵 · 客厅战场</title>
    <style>
      /* 暖黑（不是深蓝）：与场景的深棕木地板、纸盒 UI 的暖米色是同一族色，
         冷色底会在画布边缘露出一圈蓝边，和"关灯后的客厅"整体打架。 */
      html, body { margin: 0; height: 100%; background: #0e0a07; overflow: hidden; }
      #app { width: 100vw; height: 100vh; }
      /* 画布必须按像素最近邻放大，否则缩放窗口时像素块会被浏览器二次模糊 */
      #app > canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      * { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
