<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深海回响 · 侧视改造预览 V6.52</title>
<style>
  :root{
    --bg:#070d12; --panel:#0d1720; --line:#1d2f3d;
    --txt:#cfe3ee; --dim:#7c96a6; --cyan:#4fe8ff; --coral:#e2703f; --gold:#e8c46a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:16px 22px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;font-weight:500}
  h1 span{color:var(--dim);font-weight:400;margin-left:10px;font-size:13px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 22px;
       border-bottom:1px solid var(--line);background:var(--panel)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--dim);padding:7px 14px;
              font:inherit;cursor:pointer}
  .seg button.on{background:#123040;color:var(--cyan)}
  label.k{display:flex;align-items:center;gap:8px;color:var(--dim)}
  input[type=range]{width:260px}
  button.act{background:#123040;border:1px solid #1d4a5e;color:var(--cyan);
             border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
  button.act:hover{background:#17475c}
  .wrap{padding:14px 22px 30px}
  canvas{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#000}
  .note{padding:10px 22px 0;color:var(--dim);font-size:12px}
  .note b{color:var(--txt);font-weight:500}
  code{background:#122029;padding:1px 5px;border-radius:4px;color:#9fd8ea;
       font:12px/1 ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1>侧视改造预览 <span>V6.52 · 全程侧视 + 保留四边刷怪</span></h1>
</header>

<div class="bar">
  <div class="seg" id="modeSeg">
    <button data-mode="before">现状（俯视）</button>
    <button data-mode="after" class="on">改后（侧视）</button>
  </div>
  <label class="k">深度
    <input type="range" id="depth" min="0" max="11000" value="150" step="10">
    <b id="depthTxt" style="color:var(--txt)">150 m</b>
  </label>
  <button class="act" id="auto">自动下潜：开</button>
  <button class="act" id="dive">换带（下探节拍）</button>
</div>

<div class="wrap">
  <canvas id="cv"></canvas>
</div>
<div class="note">
  <b>切到「现状」看差别。</b> 现状 = 近黑水体 + 颗粒 6~20px/s + 敌人<b>整圈旋转朝玩家</b>；
  改后 = 每带一个光源 + 颗粒 46px/s 三层视差 + 敌人<b>镜像 + ±35° 限幅倾角</b> + 左侧深度计 + 右上角鱼情雷达。
  点「换带」看四段式：<code>起势 → 温跃层扫带 → crossfade → 落定</code>。
</div>

<script>
(() => {
'use strict';

const W = 1304, H = 749;

// ---- 五带（沿用 LAYERS 的 depthTop/Bot 与 V6.51 重定后的色相）----
const LAYERS = [
  { n:'阳光带', t0:0,    t1:200,   mid:100,  rgb:[ 30,110,140], motes:34,  vis:1.00 },
  { n:'弱光带', t0:200,  t1:1000,  mid:600,  rgb:[ 18, 70, 88], motes:48,  vis:0.92 },
  { n:'午夜带', t0:1000, t1:4000,  mid:2500, rgb:[ 40, 36, 86], motes:70,  vis:0.68 },
  { n:'热泉带', t0:4000, t1:6000,  mid:5000, rgb:[110, 54, 26], motes:90,  vis:0.60 },
  { n:'深渊带', t0:6000, t1:11000, mid:8500, rgb:[ 24, 20, 60], motes:110, vis:0.46 },
];
const BEFORE_RGB = [[16,22,28],[10,14,19],[5,7,10],[9,11,14],[4,5,8]];

const layerIdx = d => { let i=0; for(let k=0;k<5;k++) if(d>=LAYERS[k].t0) i=k; return i; };
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const smooth = t=>t*t*(3-2*t);

function waterColor(d){
  if (mode==='before') return BEFORE_RGB[layerIdx(d)];
  const MS = LAYERS.map(l=>l.mid);
  if (d<=MS[0]) return LAYERS[0].rgb;
  if (d>=MS[4]) return LAYERS[4].rgb;
  let i=0; while(i<3 && d>MS[i+1]) i++;
  const t = (d-MS[i])/(MS[i+1]-MS[i]);
  const a=LAYERS[i].rgb, b=LAYERS[i+1].rgb;
  return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
}
const rgb = (c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a==null?1:a})`;

// ---- 状态 ----
let mode='after', depth=150, auto=true, timeSec=0, lastLayer=0;
let vScroll=46, burst=0, burstT=9;
let trans=null, sweep=null;

const parts=[], dfish=[], enemies=[];

function initParts(){
  parts.length=0;
  for(let i=0;i<110;i++){
    const far = i<50;
    parts.push({
      x:Math.random()*W, y:Math.random()*H,
      r: far ? 2.2+Math.random()*1.8 : 1.2+Math.random()*1.2,
      far, sp: far?0.35:1.0,
      a: far?0.16:0.30,
    });
  }
}
function initDfish(){
  dfish.length=0;
  for(let i=0;i<16;i++){
    const dir = Math.random()<0.5?-1:1;
    dfish.push({
      x:Math.random()*W, y:Math.random()*H,
      len: 30+Math.random()*66, dir,
      sp: (14+Math.random()*26)*dir,
      tilt: (Math.random()-0.5)*0.34,
      a: 0.20+Math.random()*0.15,
      bob: Math.random()*6.28,
    });
  }
}
function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  const m=60; let x=0,y=0;
  if(side===0){x=-m;y=Math.random()*H}
  else if(side===1){x=W+m;y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=-m}
  else {x=Math.random()*W;y=H+m}
  enemies.push({x,y,r:9+Math.random()*9,sp:26+Math.random()*26,ph:Math.random()*6.28});
}
function initEnemies(){ enemies.length=0; for(let i=0;i<13;i++){ spawnEnemy(); enemies[i].x=Math.random()*W; enemies[i].y=Math.random()*H; } }

// ---- 形状 ----
function fishPath(ctx,len){
  const h=len*0.42;
  ctx.beginPath();
  ctx.moveTo(len*0.50,0);
  ctx.quadraticCurveTo(len*0.10,-h*0.62,-len*0.28,-h*0.34);
  ctx.quadraticCurveTo(-len*0.42,-h*0.18,-len*0.44,0);
  ctx.quadraticCurveTo(-len*0.42, h*0.18,-len*0.28, h*0.34);
  ctx.quadraticCurveTo(len*0.10, h*0.62,len*0.50,0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-len*0.44,0); ctx.lineTo(-len*0.62,-h*0.46);
  ctx.lineTo(-len*0.55,0); ctx.lineTo(-len*0.62, h*0.46);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-len*0.06,-h*0.32);
  ctx.quadraticCurveTo(len*0.06,-h*0.78,len*0.18,-h*0.20);
  ctx.closePath(); ctx.fill();
}
function drawFish(ctx,x,y,len,tilt,mirror,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt); ctx.scale(mirror,1);
  ctx.globalAlpha=alpha; ctx.fillStyle=color; fishPath(ctx,len); ctx.restore();
}
function drawSub(ctx,cx,cy,L,mirror,glow){
  const h=L*56/88;
  ctx.save(); ctx.translate(cx,cy);
  // 投影
  ctx.globalAlpha=0.30; ctx.fillStyle='#040a0e';
  ctx.beginPath(); ctx.ellipse(2,h*0.52,L*0.46,h*0.16,0,0,6.283); ctx.fill();
  ctx.scale(mirror,1);
  // 稳定鳍（打破圆轮廓）
  ctx.globalAlpha=0.95; ctx.fillStyle='#0d6675';
  ctx.beginPath(); ctx.moveTo(-L*0.20,0); ctx.lineTo(-L*0.46,-h*0.86); ctx.lineTo(-L*0.40,0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-L*0.40,0); ctx.lineTo(-L*0.50, h*0.28); ctx.lineTo(-L*0.24,0); ctx.closePath(); ctx.fill();
  // 侧壁
  ctx.globalAlpha=1; ctx.fillStyle='#0a4d59'; ctx.beginPath(); ctx.ellipse(0,h*0.16,L*0.5,h*0.42,0,0,6.283); ctx.fill();
  // 主体
  ctx.fillStyle=glow?'#15828f':'#10626e';
  ctx.beginPath(); ctx.ellipse(0,0,L*0.5,h*0.44,0,0,6.283); ctx.fill();
  // 受光弧
  ctx.globalAlpha=0.55; ctx.strokeStyle='#7fe6f5'; ctx.lineWidth=Math.max(2,L*0.028);
  ctx.beginPath(); ctx.ellipse(0,0,L*0.47,h*0.40,0,Math.PI*1.06,Math.PI*1.86); ctx.stroke();
  // 暗弧
  ctx.globalAlpha=0.5; ctx.strokeStyle='#052b33';
  ctx.beginPath(); ctx.ellipse(0,0,L*0.47,h*0.40,0,Math.PI*0.10,Math.PI*0.86); ctx.stroke();
  // 指挥塔
  ctx.globalAlpha=1; ctx.fillStyle='#0d6675';
  ctx.beginPath(); ctx.roundRect(-L*0.10,-h*0.72,L*0.22,h*0.34,L*0.05); ctx.fill();
  // 舷窗
  ctx.fillStyle='#a8f4ff';
  for(const px of [0.20,0.04,-0.12]){ ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.arc(L*px,h*0.02,L*0.030,0,6.283); ctx.fill(); }
  // 艏灯
  ctx.globalAlpha=1; ctx.fillStyle='#eafcff';
  ctx.beginPath(); ctx.arc(L*0.47,h*0.02,L*0.026,0,6.283); ctx.fill();
  ctx.restore();
}

// ---- 各带「光的主角」----
function lightWeight(d,i){ const t0=LAYERS[i].t0,t1=LAYERS[i].t1;
  const pad=(t1-t0)*0.28; return clamp((d-(t0-pad))/pad,0,1)*clamp(((t1+pad)-d)/pad,0,1); }

function drawLights(ctx,d){
  const out=[];
  for(let i=0;i<5;i++){ const w=lightWeight(d,i); if(w>0.01) out.push([i,w]); }
  for(const [i,w] of out){
    ctx.save(); ctx.globalAlpha=w;
    if(i===0){ // 丁达尔光柱
      ctx.globalCompositeOperation='lighter';
      for(let k=0;k<5;k++){
        const x0=180+k*260+Math.sin(timeSec*0.14+k)*22;
        const g=ctx.createLinearGradient(x0,0,x0-150,H);
        g.addColorStop(0,'rgba(180,240,255,0.20)'); g.addColorStop(0.6,'rgba(120,210,240,0.06)');
        g.addColorStop(1,'rgba(90,190,230,0)');
        ctx.fillStyle=g; ctx.beginPath();
        ctx.moveTo(x0-56,0); ctx.lineTo(x0+56,0); ctx.lineTo(x0-70,H); ctx.lineTo(x0-190,H);
        ctx.closePath(); ctx.fill();
      }
    } else if(i===1){ // 远处残光斑
      ctx.globalCompositeOperation='lighter';
      for(let k=0;k<3;k++){
        const cx=200+k*420, cy=110+k*80+Math.sin(timeSec*0.3+k)*16;
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,210);
        g.addColorStop(0,'rgba(140,225,240,0.16)'); g.addColorStop(1,'rgba(140,225,240,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,210,0,6.283); ctx.fill();
      }
    } else if(i===2){ // 生物荧光点链
      ctx.globalCompositeOperation='lighter';
      for(let c=0;c<4;c++){
        for(let k=0;k<16;k++){
          const kk=(k/16+timeSec*0.045+c*0.21)%1;
          const x=((c*330+kk*W*1.2)%(W+200))-100;
          const y=140+c*150+Math.sin(kk*9+c)*26;
          const a=0.32+0.30*Math.sin(timeSec*2.1+k*0.7+c);
          ctx.fillStyle=`rgba(150,140,255,${clamp(a,0,1)*0.9})`;
          ctx.beginPath(); ctx.arc(x,y,2.4,0,6.283); ctx.fill();
        }
      }
    } else if(i===3){ // 热泉烟柱
      ctx.globalCompositeOperation='lighter';
      for(let k=0;k<4;k++){
        const bx=170+k*330+Math.sin(timeSec*0.2+k)*18;
        for(let s=0;s<24;s++){
          const tt=((s/24)+timeSec*0.24+k*0.13)%1;
          const y=H-tt*H, x=bx+Math.sin(tt*7+k)*30*tt;
          ctx.fillStyle=`rgba(255,146,52,${0.24*(1-tt)*0.9})`;
          ctx.beginPath(); ctx.arc(x,y,9+tt*22,0,6.283); ctx.fill();
        }
      }
    } else { // 深渊呼吸点阵
      const pulse=0.34+0.34*Math.sin(timeSec*1.96); // 3.2s
      for(let gy=0; gy<9; gy++) for(let gx=0; gx<17; gx++){
        const x=60+gx*76+Math.sin(gy*1.7)*14, y=70+gy*80;
        const p=0.5+0.5*Math.sin(timeSec*1.96+gx*0.3+gy*0.5);
        ctx.fillStyle=`rgba(200,232,255,${0.16*pulse*p+0.05})`;
        ctx.beginPath(); ctx.arc(x,y,1.9,0,6.283); ctx.fill();
      }
    }
    ctx.restore();
  }
}

// ---- 主绘制 ----
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1;

function resize(){
  const dpr=window.devicePixelRatio||1;
  const cw=cv.clientWidth||900;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(cw*dpr*(H/W));
  cv.style.height=(cv.height/dpr)+'px';
  scale=cv.width/W; ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',()=>{resize();});

function draw(){
  const after = mode==='after';
  const wc = waterColor(depth);

  // 水体
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.fillStyle=rgb(wc); ctx.fillRect(0,0,W,H);

  if(after){
    drawLights(ctx,depth);
    ctx.globalCompositeOperation='source-over';
  }

  // 颗粒（三层视差）
  const motes = after ? LAYERS[layerIdx(depth)].motes : 30;
  for(let i=0;i<parts.length;i++){
    const m=parts[i];
    if(i>=motes) continue;
    ctx.globalAlpha = m.a * (after?1:0.55);
    ctx.fillStyle = after ? '#bff2e4' : '#8fa8ac';
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;

  // 远景鱼群剪影（不可瞄准、不碰撞、无发光核）
  for(const f of dfish){
    f.y += Math.sin(timeSec*0.7+f.bob)*0.35;
    drawFish(ctx,f.x,f.y,f.len, f.tilt, f.dir, after?'#9fe1cb':'#7d94a0', f.a*(after?1:0.5));
  }
  ctx.globalAlpha=1;

  // 敌人
  const px=W/2, py=H/2;
  for(const e of enemies){
    const dx=px-e.x, dy=py-e.y, dl=Math.hypot(dx,dy)||1;
    const vx=dx/dl*e.sp, vy=dy/dl*e.sp;
    e.x+=vx*0.016; e.y+=vy*0.016;
    e.ph+=0.05;
    const len=e.r*3.1;
    if(after){
      // 侧视：镜像 + ±35° 限幅倾角
      const mirror = vx<0?-1:1;
      const tilt = -clamp(Math.atan2(vy,Math.max(18,Math.abs(vx))),-0.61,0.61) + Math.sin(e.ph)*0.05;
      drawFish(ctx,e.x,e.y,len,tilt,mirror,'#d0603a',0.95);
    } else {
      // 现状：整圈旋转朝玩家（垂直方向的来敌会变成"竖着的鱼"—— 这就是要对比的怪）
      drawFish(ctx,e.x,e.y,len,Math.atan2(dy,dx),1,'#8a5340',0.95);
    }
    // 发光核心（铁律）
    ctx.fillStyle=after?'#ffd7a8':'#c9a98f';
    ctx.beginPath(); ctx.arc(e.x,e.y,2,0,6.283); ctx.fill();
    if(Math.hypot(e.x-px,e.y-py)<26){ e.x=-60; e.y=Math.random()*H; }
  }
  ctx.globalAlpha=1;

  // 潜航器
  drawSub(ctx,px,py,88, 1, auto);

  // 温跃层扫带
  if(sweep){
    const t=sweep.t/0.6;
    const y=H - t*H;
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=(1-t)*0.55;
    const g=ctx.createLinearGradient(0,y-40,0,y+40);
    g.addColorStop(0,'rgba(160,240,255,0)');
    g.addColorStop(0.5,'rgba(190,250,255,0.9)');
    g.addColorStop(1,'rgba(160,240,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,y-40,W,80);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  }

  if(after){ drawGauge(ctx); drawRadar(ctx,px,py); drawLabel(ctx); }
}

function drawGauge(ctx){
  const x=34,y0=190,bh=370;
  ctx.globalAlpha=0.9;
  ctx.fillStyle='rgba(8,18,24,0.55)';
  ctx.beginPath(); ctx.roundRect(x-12,y0-16,54,bh+32,10); ctx.fill();
  for(let i=0;i<5;i++){
    const t=i/5, h=bh/5;
    ctx.fillStyle= i===layerIdx(depth) ? 'rgba(79,232,255,0.85)' : 'rgba(80,120,140,0.45)';
    ctx.fillRect(x, y0+t*bh, 10, h-3);
  }
  const pos=(depth/11000)*bh;
  ctx.fillStyle='#4fe8ff';
  ctx.beginPath(); ctx.moveTo(x+16,y0+pos); ctx.lineTo(x+28,y0+pos-6);
  ctx.lineTo(x+28,y0+pos+6); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=0.28; ctx.fillRect(x+16,y0+pos-18,3,18);
  ctx.globalAlpha=1;
  ctx.fillStyle='#9fd8ea'; ctx.font='12px ui-monospace,Consolas,monospace';
  ctx.fillText(depth.toFixed(0)+' m', x-10, y0+bh+30);
}
function drawRadar(ctx,px,py){
  const R=84, cx=W-R-30, cy=R+30;
  ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(cx,cy,R+10,0,6.283);
  ctx.fillStyle='rgba(8,18,24,0.5)'; ctx.fill();
  ctx.strokeStyle='rgba(79,232,255,0.14)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,R+8,0,6.283); ctx.stroke();
  ctx.strokeStyle='rgba(79,232,255,0.28)';
  ctx.beginPath(); ctx.arc(cx,cy,R-12,0,6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,2,0,6.283); ctx.fillStyle='#4fe8ff'; ctx.fill();
  // 艏向线
  ctx.strokeStyle='rgba(79,232,255,0.35)';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R-12,cy); ctx.stroke();
  const K=(R-12)/600;
  for(const e of enemies){
    const dx=e.x-px, dy=-(e.y-py);
    const d=Math.hypot(dx,dy); if(d>600) continue;
    ctx.fillStyle='#e2703f';
    ctx.beginPath(); ctx.arc(cx+dx*K, cy+dy*K, 3, 0, 6.283); ctx.fill();
  }
  for(let i=0;i<7;i++){
    const a=i/7*6.283+timeSec*0.12;
    ctx.fillStyle='rgba(79,232,255,0.85)';
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*(40+i*6), cy+Math.sin(a)*(40+i*6), 2, 0, 6.283); ctx.fill();
  }
  ctx.fillStyle='rgba(159,216,234,0.75)'; ctx.font='11px sans-serif';
  ctx.fillText('鱼情 600px', cx-32, cy+R+26);
}
function drawLabel(ctx){
  if(!trans) return;
  const t=trans.t, L=trans.L;
  const a = t<0.35 ? t/0.35 : (t<1.75 ? 1 : clamp((2.4-t)/0.6,0,1));
  ctx.globalAlpha=a;
  ctx.textAlign='center';
  ctx.fillStyle='#eafcff'; ctx.font='500 32px -apple-system,"Microsoft YaHei",sans-serif';
  ctx.fillText(L.n, W/2, 168);
  ctx.fillStyle='rgba(159,216,234,0.9)'; ctx.font='20px ui-monospace,Consolas,monospace';
  ctx.fillText(`${L.t0}–${L.t1} m`, W/2, 200);
  ctx.textAlign='start'; ctx.globalAlpha=1;
}

// ---- 主循环 ----
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; timeSec+=dt;

  // 自动下潜：按「每带等时」配速（深度区间极不均匀，等差推进会让 L1 一闪而过）
  if(auto){
    const L0=LAYERS[layerIdx(depth)];
    depth=Math.min(11000, depth + (L0.t1-L0.t0)/11*dt);
    const li=layerIdx(depth);
    if(li!==lastLayer){ lastLayer=li; burstT=0; sweep={t:0}; trans={t:0,L:LAYERS[li]}; }
  }

  // 滚动速度
  if(burstT<3) burstT+=dt;
  burst= burstT<3 ? 220*Math.exp(-burstT/0.9) : 0;
  vScroll = (mode==='after'?46:13) + burst;

  for(const m of parts){
    m.y -= vScroll*m.sp*dt;
    if(m.y<-6){ m.y=H+6; m.x=Math.random()*W; }
  }
  for(const f of dfish){
    f.x += f.sp*dt;
    f.y -= vScroll*0.18*dt;
    if(f.x<-120) f.x=W+120; if(f.x>W+120) f.x=-120;
    if(f.y<-60){ f.y=H+60; f.x=Math.random()*W; }
  }

  if(trans){ trans.t+=dt; if(trans.t>2.4) trans=null; }
  if(sweep){ sweep.t+=dt; if(sweep.t>0.6) sweep=null; }
  if(enemies.length<13 && Math.random()<0.03) spawnEnemy();

  draw();
  requestAnimationFrame(tick);
}

// ---- 交互 ----
document.getElementById('modeSeg').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  mode=b.dataset.mode;
  [...ev.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
});
const dEl=document.getElementById('depth'), dTxt=document.getElementById('depthTxt');
dEl.addEventListener('input',()=>{ depth=+dEl.value; auto=false; lastLayer=layerIdx(depth);
  document.getElementById('auto').textContent='自动下潜：关'; dTxt.textContent=Math.round(depth)+' m'; });
document.getElementById('auto').addEventListener('click',e=>{
  auto=!auto; e.target.textContent='自动下潜：'+(auto?'开':'关'); });
document.getElementById('dive').addEventListener('click',()=>{
  const i=layerIdx(depth);
  const L=LAYERS[Math.min(4,i+ (Math.random()<0.5?0:1))];
  depth=L.t0+ (L.t1-L.t0)*0.25; auto=false; lastLayer=layerIdx(depth);
  document.getElementById('auto').textContent='自动下潜：关';
  dEl.value=depth; dTxt.textContent=depth.toFixed(0)+' m';
  burstT=0; sweep={t:0}; trans={t:0,L};
});

initParts(); initDfish(); initEnemies(); resize();
setInterval(()=>{ if(auto) { const d=depth; dTxt.textContent=d.toFixed(0)+' m'; dEl.value=d; } },120);
requestAnimationFrame(tick);
})();
</script>
